[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photosigning"
version = "1.0.0"
description = "Sign photograph pixels and provenance with Ed25519."
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "third_party/majik-signature/LICENSE",
  "third_party/majik-signature/NOTICE.md",
]
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0.0,<49",
  "Pillow>=12.0.0,<13",
  "streamlit>=1.50.0,<2",
  "numpy>=2.0,<3",
  "reedsolo>=1.7,<2",
  "opencv-python-headless>=4.10,<5",
  "c2pa-python>=0.37.10,<0.38",
  "trustmark>=0.9.2,<0.10",
  "torch>=2.3.1",
  "torchvision>=0.18.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["photosigning*"]
